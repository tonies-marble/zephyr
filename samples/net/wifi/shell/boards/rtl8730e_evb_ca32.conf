# wifi_shell's TWT commands use libm (frexp/ceil/ldexp/floor); the minimal
# libc has no libm, so use newlib (shipped with the ASDK gnuarmemb toolchain).
CONFIG_NEWLIB_LIBC=y

# The HAL os_wrapper guards on CONFIG_HEAP_MEM_POOL_SIZE directly, so the pool
# must be sized explicitly; the WHC host tasks/semaphores/scan buffers live here.
CONFIG_HEAP_MEM_POOL_SIZE=262144

