# One flashable app.bin from our images on all three cores: CA32 (default
# image, WHC host + WiFi shell), KM4 (WHC NP driver), KM0 (WiFi MAC firmware).
# The vendor IMG1 stays the bootloader; disabling MCUboot makes the CA32
# image-assembly step fold the KM4/KM0 image2 sub-images into app.bin.
SB_CONFIG_BOOTLOADER_NONE=y

SB_CONFIG_RTL8730E_BUILD_KM4_APP=y
SB_CONFIG_RTL8730E_KM4_APP_SOURCE_DIR="."
SB_CONFIG_RTL8730E_BUILD_KM0_APP=y
SB_CONFIG_RTL8730E_KM0_APP_SOURCE_DIR="."
