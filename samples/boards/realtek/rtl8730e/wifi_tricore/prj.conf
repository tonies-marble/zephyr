# Common to all three per-core images; everything role-specific lives in the
# boards/rtl8730e_evb_{ca32,km4,km0}.conf fragments.
CONFIG_EARLY_CONSOLE=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# All three cores share one LOGUART; serialize their output per line over a
# core-to-core HW semaphore so the console logs don't interleave mid-line.
CONFIG_UART_AMEBA_LOGUART_XCORE_LOCK=y
