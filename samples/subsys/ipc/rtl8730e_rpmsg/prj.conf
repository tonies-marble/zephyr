CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_IPC_SERVICE_LOG_LEVEL_INF=y

CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y
CONFIG_OPENAMP=y

# The PSRAM / SRAM shared regions retain their contents across a warm reset, so
# every core must zero its vdev status area at init rather than trust stale
# shared state.  This matters most on the REMOTES (KM4/KM0): they boot seconds
# before the CA32 (which waits on TF-A/SMP bring-up), and without the reset they
# read the *previous* run's DRIVER_OK, skip waiting for the host and fire their
# one-shot NS announcement into vrings the host later re-initializes -- the
# announcement is wiped and the endpoint can never bind.  The remote-side reset
# is safe here because the SoC boot flow guarantees the remotes boot (and clear
# the status page at PRE_KERNEL_1) long before the host opens the instances.
# (prj.conf is shared by all three domains; each option only affects instances
# of the matching role, so both are enabled here.)
CONFIG_IPC_SERVICE_BACKEND_RPMSG_SHMEM_RESET=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG_SHMEM_RESET_REMOTE=y

# Cache coherency for the shared vrings is handled by mapping them
# non-cacheable on every core, so OpenAMP does NOT need to perform software
# cache ops (CONFIG_OPENAMP_WITH_DCACHE stays off):
#   * CA32 (host)  -- Normal-Non-cacheable MMU regions REGION_KM4_VRING /
#     REGION_KM0_VRING (soc/.../amebasmart/mmu_regions.c).
#   * KM0 (remote) -- has no D-cache at all.
#   * KM4 (remote) -- has a D-cache and runs from PSRAM, but its vring node
#     (sram_ipc @ 0x60700000) carries zephyr,memory-attr = ATTR_MPU_RAM_NOCACHE,
#     so the arch MPU init (CONFIG_MEM_ATTR) auto-programs it Normal-Non-cacheable
#     from devicetree -- no custom SoC MPU table needed.
# Keeping the default MEM_ALIGNMENT is fine because no core caches the vrings.
