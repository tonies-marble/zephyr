# Sysbuild configuration for the RTL8730E tri-core rpmsg sample.
#
# Build one flashable app.bin that combines all three OUR cores:
#   * CA32 (default image, this sample built for rtl8730e_evb/rtl8730e/ca32) --
#     the rpmsg host; its non-MCUboot image-assembly step (merge_bin.py
#     handle_amebasmart) folds in the KM4 and KM0 image2 sub-images.
#   * KM4  (rtl8730e_evb/rtl8730e/km4)  -- rpmsg remote, packaged image2.
#   * KM0  (rtl8730e_evb/rtl8730e/km0)  -- rpmsg remote, packaged image2.
#
# No MCUboot: the vendor IMG1 (km4_boot_all.bin) stays the bootloader, and the
# CA32 image emits app.bin for the vendor IMG2 slot. Disabling MCUboot is what
# makes the CA32 SOC CMakeLists run handle_amebasmart (the combine path).
SB_CONFIG_BOOTLOADER_NONE=y

# Build the KM4 and KM0 remotes from THIS sample (relative to APP_DIR) for their
# respective core board targets. The board sysbuild.cmake adds them as build-only
# images ordered before the CA32 image so their image2 outputs exist at combine
# time.
SB_CONFIG_RTL8730E_BUILD_KM4_APP=y
SB_CONFIG_RTL8730E_KM4_APP_SOURCE_DIR="."
SB_CONFIG_RTL8730E_BUILD_KM0_APP=y
SB_CONFIG_RTL8730E_KM0_APP_SOURCE_DIR="."
