# MCUboot Kconfig fragment for the RTL8730E EVB.  It lives in the board tree
# (not the MCUboot repo) and is injected into the mcuboot image by this board's
# sysbuild.cmake (mcuboot_EXTRA_CONF_FILE), so the upstream MCUboot repo stays
# pristine.

# The MCUboot image is SRAM-resident inside the ROM boot-copy window; it
# inherits non-XIP from the board default and keeps its lean C library /
# mbedTLS footprint here.
CONFIG_MINIMAL_LIBC=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=4

# The KM4 bootloader SRAM is only ~96 KB (dts sram0 = 0x17FE0), bounded by the
# mask ROM's boot copy window [HS_BOOT_ADDR_START, HS_BOOT_ADDR_END]. Upstream
# mcuboot's default main stack (10240 B, prj.conf) overruns that window;
# RSA-2048 verify runs on the main stack (no mbedtls heap:
# MBEDTLS_ENABLE_HEAP=n, HEAP_MEM_POOL_SIZE=0), so 8192 is the floor that
# still leaves headroom for the modexp -- do NOT cut further.
CONFIG_MAIN_STACK_SIZE=8192
